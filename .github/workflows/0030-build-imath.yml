name: 0030 - Build Imath

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag or branch to build'
        required: true
        type: string
        default: 'v3.2.2'
      target_os:
        description: 'Target OS to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - ubuntu-24.04
          - rocky-9

permissions:
  contents: write

jobs:
  build-ubuntu:
    if: ${{ github.event.inputs.target_os == 'ubuntu-24.04' || github.event.inputs.target_os == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git curl ninja-build \
                                  libpng-dev libtiff-dev libjpeg-dev libwebp-dev \
                                  libssl-dev yasm pkg-config ruby ruby-dev rubygems
          sudo gem install fpm

      - name: Fetch Previously Built Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ubuntu-24.04 -R ${{ github.repository }} -p "*.deb" || echo "No previous DEB packages found or release doesn't exist yet."
          if ls *.deb 1> /dev/null 2>&1; then
            sudo apt-get install -y ./*.deb
          fi

      - name: Clone Dependency
        run: git clone --branch ${{ inputs.version }} --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git /tmp/src

      - name: Build and Package (CMake)
        run: |
          cd /tmp/src
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/installdir/usr/local -DBUILD_TESTING=OFF -DOIIO_BUILD_TESTS=OFF
          cmake --build build -j$(nproc)
          cmake --install build
          fpm -s dir -t deb -n imath -v ${{ inputs.version }} -C /tmp/installdir .
          mkdir -p ${{ github.workspace }}
          cp *.deb ${{ github.workspace }}/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          gh release upload ubuntu-24.04 *.deb --clobber || gh release create ubuntu-24.04 *.deb -t "Ubuntu 24.04 Dependencies" -n "Rolling release"

  build-rocky:
    if: ${{ github.event.inputs.target_os == 'rocky-9' || github.event.inputs.target_os == 'all' }}
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install Build Prerequisites
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf groupinstall -y "Development Tools"
          dnf install -y --allowerasing cmake git curl ninja-build rpm-build yasm \
                         libpng-devel libtiff-devel libjpeg-turbo-devel libwebp-devel \
                         openssl-devel ruby ruby-devel rubygems
          gem install fpm

      - name: Fetch Previously Built Dependencies
        run: |
          dnf install -y --allowerasing gh
          gh release download rocky-9 -R ${{ github.repository }} -p "*.rpm" || echo "No previous RPM packages found or release doesn't exist yet."
          if ls *.rpm 1> /dev/null 2>&1; then
            dnf install -y ./*.rpm
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Dependency
        run: git clone --branch ${{ inputs.version }} --depth 1 https://github.com/AcademySoftwareFoundation/Imath.git /tmp/src

      - name: Build and Package (CMake)
        run: |
          cd /tmp/src
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/installdir/usr/local -DBUILD_TESTING=OFF -DOIIO_BUILD_TESTS=OFF
          cmake --build build -j$(nproc)
          cmake --install build
          fpm -s dir -t rpm -n imath -v ${{ inputs.version }} -C /tmp/installdir .
          mkdir -p ${{ github.workspace }}
          cp *.rpm ${{ github.workspace }}/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          gh release upload rocky-9 *.rpm --clobber || gh release create rocky-9 *.rpm -t "Rocky 9 Dependencies" -n "Rolling release"
