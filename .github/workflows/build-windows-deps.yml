name: Windows - Build Dependencies (vcpkg)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '4ebb30167f14487dcb71fac13efbf63273ab6a3f'
          vcpkgDirectory: '${{ runner.workspace }}/vcpkg'

      - name: Force Release Build Only
        run: |
          Add-Content -Path "${{ runner.workspace }}/vcpkg/triplets/x64-windows.cmake" -Value "set(VCPKG_BUILD_TYPE release)" -Encoding ascii

      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/.github/workflows/build-windows-deps.yml') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      - name: Restore vcpkg binaries
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-binaries-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/.github/workflows/build-windows-deps.yml') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-

      - name: Install Dependencies
        shell: bash
        run: |
          vcpkg install \
            bdwgc \
            boost \
            dav1d \
            doctest \
            expat \
            ffmpeg \
            glew \
            imath \
            libatomic-ops \
            libjpeg-turbo \
            libpng \
            libraw \
            libwebp \
            nanobind \
            opencolorio \
            openexr \
            openimageio[ffmpeg,libraw,freetype,opencolorio,openjpeg,webp] \
            openjpeg \
            openjph \
            openssl \
            pcre2 \
            spdlog \
            tiff \
            yaml-cpp \
            zlib \
            --clean-after-build \
            --triplet x64-windows

      - name: Export Binary Archive
        shell: bash
        run: |
          vcpkg export \
            bdwgc \
            boost \
            dav1d \
            doctest \
            expat \
            ffmpeg \
            glew \
            imath \
            libatomic-ops \
            libjpeg-turbo \
            libpng \
            libraw \
            libwebp \
            nanobind \
            opencolorio \
            openexr \
            openimageio \
            openjpeg \
            openjph \
            openssl \
            pcre2 \
            spdlog \
            tiff \
            yaml-cpp \
            zlib \
            --raw --output-dir=exported_deps --output=utv-deps-windows-x64

      - name: Package MSI Installer (CPack WiX)
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" ..
          cpack -G WIX -C Release

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload windows-x64 build/OpenUTVDeps-2026.1.0-win64.msi --clobber || gh release create windows-x64 build/OpenUTVDeps-2026.1.0-win64.msi -t "Windows x64 Dependencies" -n "Rolling release powered by vcpkg"

      - name: Save vcpkg downloads
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ runner.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/.github/workflows/build-windows-deps.yml') }}

      - name: Save vcpkg binaries
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-binaries-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/.github/workflows/build-windows-deps.yml') }}
