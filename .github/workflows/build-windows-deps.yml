name: Windows - Build Dependencies (vcpkg)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_BINARY_SOURCES: "clear;gha,readwrite"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/vcpkg'
          # Baseline is handled by vcpkg-configuration.json

      - name: Force Release Build Only
        run: |
          Add-Content -Path "${{ runner.workspace }}/vcpkg/triplets/x64-windows.cmake" -Value "set(VCPKG_BUILD_TYPE release)" -Encoding ascii

      - name: Install Dependencies
        shell: bash
        run: |
          vcpkg install --triplet x64-windows --clean-after-build

      - name: Export Binary Archive
        shell: bash
        run: |
          # We use the list of top-level dependencies from vcpkg.json for export
          # Since export --raw doesn't currently support manifest files directly
          mkdir -p exported_deps
          vcpkg export \
            bdwgc boost dav1d doctest expat ffmpeg freetype glew imath \
            libatomic-ops libjpeg-turbo libpng libraw libwebp nanobind \
            opencolorio openexr openimageio openjpeg openjph openssl \
            pcre2 spdlog tiff yaml-cpp zlib \
            --raw --output-dir=exported_deps --output=utv-deps-windows-x64

      - name: Package MSI Installer (CPack WiX)
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 18 2026" ..
          cpack -G WIX -C Release --debug --verbose

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CMAKE_VER=$(grep -i "project(OpenUTVDependencies VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9\.]+).*/\1/')
          VERSION="v${CMAKE_VER}"
          gh release create $VERSION build/OpenUTVDeps-${CMAKE_VER}-win64.msi -t "Windows x64 Dependencies $VERSION" -n "Source-driven dependency build ($VERSION)" || gh release upload $VERSION build/OpenUTVDeps-${CMAKE_VER}-win64.msi --clobber
