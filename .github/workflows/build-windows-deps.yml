name: Windows - Build Dependencies (vcpkg)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '4ebb30167f14487dcb71fac13efbf63273ab6a3f'
          vcpkgDirectory: '${{ runner.workspace }}/vcpkg'

      - name: Install Dependencies
        run: |
          vcpkg install boost openjph imath openexr opencolorio ffmpeg openimageio[ffmpeg,libraw,freetype,opencolorio,openjpeg,webp] yaml-cpp spdlog icu libjpeg-turbo --triplet x64-windows

      - name: Export Binary Archive
        run: |
          vcpkg export boost openjph imath openexr opencolorio ffmpeg openimageio yaml-cpp spdlog icu libjpeg-turbo --raw --output-dir=exported_deps --output=utv-deps-windows-x64

      - name: Package MSI Installer (CPack WiX)
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" ..
          cpack -G WIX

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload windows-x64 build/OpenUTVDeps-2026.1.0-win64.msi --clobber || gh release create windows-x64 build/OpenUTVDeps-2026.1.0-win64.msi -t "Windows x64 Dependencies" -n "Rolling release powered by vcpkg"
